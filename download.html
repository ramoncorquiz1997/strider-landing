<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descarga Strider — Tu ciudad. Tu territorio.</title>
  <meta name="description" content="Descarga Strider gratis en el App Store. Convierte cada carrera en conquista territorial.">
  <meta property="og:title" content="Descarga Strider — Tu ciudad. Tu territorio.">
  <meta property="og:description" content="Convierte cada carrera en conquista. Captura hexágonos, expande tu zona y domina tu ciudad.">
  <meta property="og:url" content="https://strider.lat/download">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 55% at 75% 10%, rgba(245,166,35,0.22), transparent 65%),
        radial-gradient(45% 40% at 10% 80%, rgba(181,245,58,0.09), transparent 60%);
      z-index: 0;
    }

    main {
      flex: 1;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(48px, 8vh, 80px) clamp(20px, 5vw, 48px);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: clamp(40px, 7vh, 64px);
    }
    .hex {
      width: 28px;
      height: 25px;
      background: linear-gradient(150deg, #F7B43E, #F5A623);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .logo-text {
      font-family: 'Clash Display', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      margin-bottom: clamp(20px, 3vh, 28px);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B5F53A;
      box-shadow: 0 0 8px #B5F53A;
    }

    h1 {
      font-family: 'Clash Display', -apple-system, sans-serif;
      font-weight: 600;
      font-size: clamp(54px, 14vw, 148px);
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 8px 40px rgba(10,20,30,0.5);
      margin-bottom: clamp(18px, 3vh, 28px);
    }

    p.sub {
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 500;
      line-height: 1.55;
      color: rgba(255,255,255,0.7);
      max-width: 44ch;
      text-shadow: 0 2px 16px rgba(10,20,30,0.6);
      margin-bottom: clamp(36px, 5vh, 52px);
    }

    .appstore {
      display: inline-block;
      transition: opacity 0.18s, transform 0.18s;
    }
    .appstore:hover { opacity: 0.85; transform: translateY(-2px); }
    .appstore img { height: 56px; width: auto; }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px clamp(20px, 5vw, 48px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 16px;
    }
    footer a {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.15s;
    }
    footer a:hover { color: #F5A623; }
    footer .sep { color: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="page">

    <main>
      <div class="logo">
        <div class="hex"></div>
        <span class="logo-text">STRIDER</span>
      </div>

      <h1>Tu ciudad.<br>Tu territorio.</h1>

      <p class="sub">Captura zonas en el mapa, domina tu ciudad y gana premios por hacerlo.</p>

      <a href="https://apps.apple.com/mx/app/strider/id6776907250"
         class="appstore"
         target="_blank"
         rel="noopener"
         aria-label="Descargar Strider en el App Store">
        <picture>
          <source media="(prefers-color-scheme: light)" srcset="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/es-mx?size=250x83">
          <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/white/es-mx?size=250x83" alt="Download on the App Store" width="190" height="63">
        </picture>
      </a>
    </main>

    <footer>
      <a href="/privacy">Privacidad</a>
      <span class="sep">·</span>
      <a href="/terms">Términos</a>
      <span class="sep">·</span>
      <a href="/support">Soporte</a>
      <span class="sep">·</span>
      <a href="mailto:hola@strider.lat">hola@strider.lat</a>
    </footer>

  </div>
</body>
</html>
